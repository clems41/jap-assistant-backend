[project]
name = "jap-assistant-backend"
version = "0.1.0"
description = "API backend for JAP Assistant - Padel tournament management"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.6",
    "drf-spectacular>=0.28",
    "channels[daphne]>=4.2",
    "channels-redis>=4.2",
    "celery>=5.4",
    "redis>=5.2",
    "qrcode[pil]>=8.0",
    "Pillow>=11.1",
    "gunicorn>=23.0",
    "uvicorn>=0.32",
    "whitenoise>=6.8",
    "pypdfium2>=4",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-asyncio>=1.4",
    "factory-boy>=3.3",
    "faker>=33.0",
    "fpdf2>=2.8",
    "ruff>=0.9",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = [
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
]
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["N802", "N803"]
"*/migrations/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.local"
