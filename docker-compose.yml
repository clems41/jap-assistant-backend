# Local development environment
# Usage: docker compose up

services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: jap_local
      POSTGRES_USER: jap
      POSTGRES_PASSWORD: jap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jap -d jap_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    command: uv run python manage.py migrate --noinput
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - uv_cache:/root/.cache/uv
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgresql://jap:jap@db:5432/jap_local
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps:/app/apps     # hot reload — source code only
      - ./config:/app/config # hot reload — django config
      - ./input_pdf:/app/input_pdf # utiles pour récupérer les PDF des classements
      - uv_cache:/root/.cache/uv
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgresql://jap:jap@db:5432/jap_local
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uv_cache:
